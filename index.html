<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Crypto</title>
<style>
:root{
--bg:#08080d;--bg2:#10111a;--bg3:#181a27;--bg4:#1f2235;
--card:#13142180;--card2:#1a1c2d;--card3:#22243a;
--tx:#e8eaf0;--tx2:#a0a4b8;--tx3:#6b6f85;
--acc:#4f8cff;--acc2:#3a6fd8;--w1:#378ADD;--w2:#BA7517;
--grn:#22c55e;--grn2:#16a34a;--red:#ef4444;--red2:#dc2626;
--ylw:#eab308;--ylw2:#ca8a04;
--brd:#ffffff0d;--brd2:#ffffff15;
--r:14px;--r2:10px;--r3:8px;
--shadow:0 4px 24px #0004,0 1px 4px #0002;
--glow:0 0 40px #4f8cff15;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;line-height:1.5}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:9px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .2s}
input,select{font-family:inherit;outline:none;border:1px solid var(--brd2);background:var(--bg2);color:var(--tx);padding:10px 14px;border-radius:var(--r3);font-size:.92rem;transition:border .2s}
input:focus,select:focus{border-color:var(--acc)}
select option{background:var(--bg2)}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 20px;display:flex;align-items:center;height:60px;gap:6px;backdrop-filter:blur(20px)}
.nav-btn{padding:8px 18px;border-radius:var(--r3);background:transparent;color:var(--tx2);font-size:.88rem;font-weight:500;letter-spacing:.02em}
.nav-btn:hover{background:var(--bg4);color:var(--tx)}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-sep{width:1px;height:24px;background:var(--brd2);margin:0 4px}
.nav-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.nav-icon{width:38px;height:38px;border-radius:var(--r3);background:transparent;color:var(--tx2);font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.nav-icon:hover{background:var(--bg4);color:var(--tx)}
.btn-add{padding:8px 18px;border-radius:var(--r3);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:.88rem;font-weight:600;letter-spacing:.02em}
.btn-add:hover{filter:brightness(1.15);transform:translateY(-1px)}
#syncInfo{font-size:.72rem;color:var(--tx3);white-space:nowrap;max-width:120px;text-align:right;line-height:1.2}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.card-header{font-size:.82rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;font-weight:600}

/* METRIC CARDS */
.metrics{display:grid;gap:14px;margin-bottom:24px}
.metrics.m3{grid-template-columns:repeat(3,1fr)}
.metrics.m4{grid-template-columns:repeat(4,1fr)}
.metric{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(12px)}
.metric .label{font-size:.78rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
.metric .val{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.metric .val.sm{font-size:1.15rem}
.metric .sub{font-size:.8rem;color:var(--tx3);margin-top:3px}
.metric.big .val{font-size:2rem}
.metric.hero{background:linear-gradient(135deg,#4f8cff12,#4f8cff05);border-color:#4f8cff30}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--bg3);border-radius:var(--r3);padding:3px;width:fit-content}
.tab{padding:8px 20px;border-radius:6px;background:transparent;color:var(--tx2);font-size:.85rem;font-weight:500}
.tab:hover{color:var(--tx)}
.tab.active{background:var(--bg);color:var(--tx);box-shadow:0 2px 8px #0003}

/* WALLET SELECTOR */
.wallet-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.wallet-card{padding:16px;border-radius:var(--r2);border:2px solid var(--brd);background:var(--card);cursor:pointer;transition:all .2s}
.wallet-card:hover{border-color:var(--tx3)}
.wallet-card.sel{border-color:var(--w1);background:#378ADD10}
.wallet-card.sel.w2{border-color:var(--w2);background:#BA751710}
.wallet-card .wname{font-weight:600;font-size:.95rem;margin-bottom:2px}
.wallet-card .wtype{font-size:.78rem;color:var(--tx3)}
.wallet-card .wval{font-size:1.2rem;font-weight:700;margin-top:6px}

/* PANELS ROW */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px}
.panel h3{font-size:.82rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}

/* DONUT */
.donut-wrap{position:relative;width:240px;height:240px;margin:0 auto;flex-shrink:0}
.donut-wrap canvas{width:240px;height:240px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center .dval{font-size:1.2rem;font-weight:700}
.donut-center .dlbl{font-size:.72rem;color:var(--tx3)}
.legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--tx2)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* BAR chart */
.bar-row{margin-bottom:14px}
.bar-label{font-size:.82rem;color:var(--tx2);margin-bottom:4px;display:flex;justify-content:space-between}
.bar-track{height:22px;background:var(--bg3);border-radius:6px;overflow:hidden;display:flex}
.bar-fill{height:100%;transition:width .4s;border-radius:6px}
.bar-sub{font-size:.73rem;color:var(--tx3);margin-top:2px;display:flex;gap:12px}
.hodl-defi-summary{display:flex;gap:20px;margin-bottom:16px;font-size:.85rem}
.hodl-defi-summary span{display:flex;align-items:center;gap:6px}
.hodl-defi-summary .dot{width:10px;height:10px;border-radius:3px}
.comp-panel{margin-bottom:20px}
.panels .comp-panel{margin-bottom:0}
.panels .donut-wrap,.panels .donut-wrap canvas{width:200px;height:200px}
.comp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.comp-head h3{margin:0;font-size:.82rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.comp-toggle{display:flex;gap:3px;background:var(--bg3);border-radius:var(--r3);padding:3px}
.ctab{padding:5px 14px;border-radius:6px;background:transparent;color:var(--tx2);font-size:.8rem;font-weight:500}
.ctab:hover{color:var(--tx)}
.ctab.active{background:var(--bg);color:var(--tx);box-shadow:0 2px 8px #0003}
.comp-donut{display:flex;align-items:center;gap:32px;flex-wrap:wrap;justify-content:center}
.comp-donut .legend{margin-top:0;flex-direction:column;gap:11px;align-items:flex-start;min-width:160px}
.comp-donut .legend-item{font-size:.88rem}
.comp-bars{margin-top:4px}
.wpnl{font-size:.82rem;font-weight:600;margin-top:3px}
.wallet-card{display:flex;justify-content:space-between;align-items:stretch;gap:16px}
.wc-left{display:flex;flex-direction:column;min-width:0}
.wc-right{display:flex;flex-direction:column;justify-content:center;gap:10px;width:46%;flex-shrink:0;padding:12px 16px;background:#ffffff06;border:1px solid var(--brd);border-radius:var(--r2)}
.wc-split{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wcs-l{font-size:.74rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wcs-v{font-size:.95rem;font-weight:600;white-space:nowrap}
.wcs-pct{font-size:.78rem;color:var(--tx3);font-weight:500}
@media(max-width:560px){.wallet-card{flex-direction:column}.wc-right{width:100%}}
.defi-card{margin-top:20px}
.defi-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.defi-head h3{font-size:.95rem;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.defi-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.dm-label{font-size:.74rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600}
.dm-val{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.defi-list{display:flex;flex-direction:column;gap:8px}
.defi-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg3);border-radius:var(--r3);cursor:pointer;transition:background .15s}
.defi-row:hover{background:var(--bg4)}
.defi-pair{font-weight:600;font-size:.95rem}
.defi-proto{font-size:.78rem;color:var(--tx3);margin-top:1px}
.defi-right{display:flex;align-items:center;gap:12px}
.defi-val{font-weight:600}
@media(max-width:560px){.defi-metrics{grid-template-columns:1fr;gap:10px}}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.76rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--brd)}
td{padding:12px;border-bottom:1px solid var(--brd);font-size:.88rem;vertical-align:middle}
tr:hover{background:var(--bg4)20}
.asset-cell{display:flex;align-items:center;gap:10px}
.asset-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.asset-ico{width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--bg3)}
.na-sug-list{margin:-4px 0 14px;border:1px solid var(--brd2);border-radius:var(--r3);overflow:hidden}
.na-sug{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:.88rem;background:var(--bg2);transition:background .15s}
.na-sug:hover{background:var(--bg4)}
.na-sug img{width:20px;height:20px;border-radius:50%}
.na-sug span{color:var(--tx3);font-size:.78rem;margin-left:auto}
.asset-sym{font-weight:600}
.asset-name{font-size:.78rem;color:var(--tx3)}
.price-sub{font-size:.76rem;color:var(--tx3)}
.pnl-pos{color:var(--grn)}
.pnl-neg{color:var(--red)}
.actions{display:flex;gap:4px}
.act-btn{width:32px;height:32px;border-radius:6px;background:var(--bg3);color:var(--tx2);font-size:.85rem;display:flex;align-items:center;justify-content:center}
.act-btn:hover{background:var(--bg4);color:var(--tx)}
.act-btn.del:hover{background:#ef444420;color:var(--red)}

/* POOL CARDS */
.pool-filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.pill{padding:7px 16px;border-radius:20px;background:var(--bg3);color:var(--tx2);font-size:.84rem;font-weight:500}
.pill:hover{background:var(--bg4);color:var(--tx)}
.pill.active{background:var(--acc);color:#fff}
.pool-list{display:flex;flex-direction:column;gap:12px}
.pool-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;border-left:4px solid var(--grn);transition:all .2s;cursor:pointer}
.pool-card:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:var(--shadow)}
.pool-card.closed{border-left-color:var(--tx3)}
.pool-card.rewards{border-left-color:var(--ylw)}
.pool-card.out-range{border-left-color:var(--red)}
.pool-card.near-range{border-left-color:var(--ylw)}
.pool-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.pool-pair{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.pool-meta{font-size:.8rem;color:var(--tx3)}
.badge{padding:3px 10px;border-radius:12px;font-size:.73rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-active{background:#22c55e20;color:var(--grn)}
.badge-closed{background:#6b6f8520;color:var(--tx3)}
.badge-rewards{background:#eab30820;color:var(--ylw)}
.badge-range-unknown{background:#4f8cff20;color:var(--acc)}
.badge-range-in{background:#22c55e20;color:var(--grn)}
.badge-range-near{background:#eab30820;color:var(--ylw)}
.badge-range-out{background:#ef444420;color:var(--red)}
.badge-reinvertido{background:#4f8cff20;color:var(--acc)}
.badge-retirado{background:#22c55e20;color:var(--grn)}
.badge-pendiente{background:#eab30820;color:var(--ylw)}
.wtag{padding:3px 10px;border-radius:12px;font-size:.73rem;font-weight:600}
.pool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pool-stat .ps-label{font-size:.74rem;color:var(--tx3);margin-bottom:2px}
.pool-stat .ps-val{font-size:1rem;font-weight:600}
.pool-v3-mini{margin-top:14px;padding-top:14px;border-top:1px solid var(--brd);display:grid;grid-template-columns:1.1fr .9fr .9fr .9fr;gap:12px;align-items:center}
.range-line{height:8px;background:var(--bg3);border-radius:999px;position:relative;overflow:hidden}
.range-line:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ef444440,#eab30840,#22c55e55,#eab30840,#ef444440)}
.range-marker{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--acc);transform:translate(-50%,-50%);box-shadow:0 0 0 4px #4f8cff20}
.range-marker.out{border-color:var(--red);box-shadow:0 0 0 4px #ef444420}
.range-marker.near{border-color:var(--ylw);box-shadow:0 0 0 4px #eab30820}
.v3-label{font-size:.72rem;color:var(--tx3);margin-bottom:4px}
.v3-val{font-size:.9rem;font-weight:600}
.v3-range-wrap{display:flex;flex-direction:column;gap:7px}
.v3-range-caps{display:flex;justify-content:space-between;font-size:.72rem;color:var(--tx3)}
.v3-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.v3-detail-card{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r2);padding:14px}
.v3-detail-card .label{font-size:.72rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.v3-detail-card .val{font-size:1rem;font-weight:700}
.v3-range-panel{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r2);padding:16px}
.form-section-muted{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r2);padding:14px;margin-top:12px}

/* DETAIL VIEW */
.detail-header{margin-bottom:24px}
.detail-pair{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.detail-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--tx2)}
.detail-section{margin-bottom:24px}
.detail-section h3{font-size:.9rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.token-row{display:flex;gap:16px;margin-bottom:8px;align-items:center}
.token-row .tsym{font-weight:600;min-width:60px}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.comp-card{padding:18px;border-radius:var(--r2);border:1px solid var(--brd)}
.comp-card h4{font-size:.82rem;color:var(--tx2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.comp-card .cv{font-size:1.3rem;font-weight:700}
.verdict{padding:16px 20px;border-radius:var(--r2);font-size:1rem;font-weight:600;text-align:center}
.verdict.pos{background:#22c55e15;color:var(--grn);border:1px solid #22c55e30}
.verdict.neg{background:#ef444415;color:var(--red);border:1px solid #ef444430}
/* BENCHMARK: 3 activos configurables */
.bench-grid{display:flex;flex-direction:column;gap:14px}
.bench-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bname{font-weight:600;font-size:1rem;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bname img{width:22px;height:22px;border-radius:50%;flex-shrink:0}
.btype{font-size:.68rem;color:var(--tx3);border:1px solid var(--brd2);border-radius:20px;padding:1px 8px;white-space:nowrap;flex-shrink:0}
.bench-acts{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.bench-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px;text-align:center;color:var(--tx3)}
.il-box{padding:16px 20px;border-radius:var(--r2);margin-bottom:16px}
.il-box.loss{background:#ef444410;border:1px solid #ef444425}
.il-box.gain{background:#22c55e10;border:1px solid #22c55e25}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--brd)}
.btn{padding:10px 22px;border-radius:var(--r3);font-size:.88rem;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-secondary{background:var(--bg3);color:var(--tx2)}
.btn-secondary:hover{background:var(--bg4);color:var(--tx)}
.btn-danger{background:#ef444420;color:var(--red)}
.btn-danger:hover{background:#ef444430}
.btn-success{background:#22c55e20;color:var(--grn)}
.btn-success:hover{background:#22c55e30}
.btn-warning{background:#eab30820;color:var(--ylw)}
.btn-warning:hover{background:#eab30830}
.hint{font-size:.78rem;color:var(--tx3);margin-top:8px;font-style:italic}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.summary-wallet{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px}
.summary-wallet h3{font-size:1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sw-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.88rem}
.sw-row .swl{color:var(--tx2)}
.ranking{margin-bottom:24px}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--brd);font-size:.88rem}
.rank-pos{font-weight:700;color:var(--tx3);min-width:24px}
.rank-pair{font-weight:600}
.rank-roi{margin-left:auto;font-weight:600}
.alert-panel{background:#eab30808;border:1px solid #eab30825;border-radius:var(--r);padding:16px 20px}
.alert-item{padding:8px 0;border-bottom:1px solid var(--brd);font-size:.88rem;display:flex;justify-content:space-between}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:#000a;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px #000a;transform:translateY(10px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h2{font-size:1.15rem;font-weight:700;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;background:var(--bg3);color:var(--tx2);font-size:1rem;display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;color:var(--tx2);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select{width:100%}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.purchase-history{margin-bottom:16px}
.purchase-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg3);border-radius:6px;margin-bottom:6px;font-size:.84rem}
.preview-box{background:var(--bg3);border-radius:var(--r3);padding:12px 16px;margin-bottom:16px;font-size:.88rem}
.preview-box .pv-label{color:var(--tx2);font-size:.78rem}
.preview-box .pv-val{font-weight:700;font-size:1.05rem;margin-top:2px}
.divider{height:1px;background:var(--brd);margin:16px 0}

/* RESPONSIVE */
@media(max-width:768px){
.panels{grid-template-columns:1fr}
.pool-grid{grid-template-columns:repeat(2,1fr)}
.pool-v3-mini,.v3-detail-grid{grid-template-columns:1fr 1fr}

<script>
// ===================== SUPABASE =====================
const SB_URL='https://ffknejjagedfykrvmhgl.supabase.co';
const SB_KEY='sb_publishable_gQ2OmFKkam2QAiVlgLlr1Q_WzhUWCBY';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let sbUser=null, cloudReady=false, saveTimer=null;

// ===================== DB =====================
const DB_KEY='crmcrypto_v3';
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||defaultDB()}catch(e){return defaultDB()}}
function saveLocal(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
// saveDB: guarda local al instante + nube en segundo plano (debounced)
function saveDB(d){
  saveLocal(d);
  realSeriesCache={};realSeriesLoading={}; // los datos cambiaron: las series históricas (global + por wallet) se recalculan

  if(cloudReady&&sbUser){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>pushCloud(d),800);
  }
}
async function pushCloud(d){
  try{
    const {error}=await sb.from('crypto_crm').upsert({user_id:sbUser.id,data:d,updated_at:new Date().toISOString()});
    if(error){console.warn('Cloud save error:',error.message);return false}
    updateSyncInfo();return true;
  }catch(e){console.warn('Cloud save failed',e);return false}
}
// Devuelve {ok,data} para distinguir error de red (ok:false) de usuario sin datos (ok:true,data:null)
async function pullCloud(){
  try{
    const {data,error}=await sb.from('crypto_crm').select('data,updated_at').eq('user_id',sbUser.id).maybeSingle();
    if(error){console.warn('Cloud load error:',error.message);return {ok:false,data:null}}
    return {ok:true,data:data?data.data:null};
  }catch(e){console.warn('Cloud load failed',e);return {ok:false,data:null}}
}
function defaultDB(){return{config:{wallet1Name:'Wallet 1',wallet2Name:'Wallet 2 (compartida)'},assets:[],positions:[],snapshots:[],lastSync:0}}
function dbIsEmpty(d){return !d||((!d.assets||!d.assets.length)&&(!d.positions||!d.positions.length))}
let db=loadDB();

// ===================== AUTH =====================
function authShow(show){const o=$('#authOverlay');if(o)o.style.display=show?'flex':'none'}
function authError(msg){const m=$('#authMsg');if(m)m.textContent=msg}
async function authLogin(){
  authError('');
  const email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  if(!email||!pass){authError('Rellena email y contraseña');return}
  $('#authBtnLogin').textContent='Entrando...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  $('#authBtnLogin').textContent='Entrar';
  if(error){authError(error.message);return}
  await onLoggedIn(data.user);
}
async function authSignup(){
  authError('');
  const email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  if(!email||!pass){authError('Rellena email y contraseña');return}
  if(pass.length<6){authError('La contraseña necesita 6+ caracteres');return}
  $('#authBtnSignup').textContent='Creando...';
  const {data,error}=await sb.auth.signUp({email,password:pass});
  $('#authBtnSignup').textContent='Crear cuenta nueva';
  if(error){authError(error.message);return}
  if(data.user&&!data.session){authError('Cuenta creada. Revisa tu email para confirmar y luego entra.');return}
  await onLoggedIn(data.user);
}
async function authLogout(){await sb.auth.signOut();location.reload()}
async function onLoggedIn(user){
  sbUser=user;
  authError('Sincronizando...');
  const res=await pullCloud();

  if(!res.ok){
    // ERROR de red/permisos: NO subir nada para no pisar datos buenos. Trabajar en local y reintentar.
    cloudReady=false;
    authError('Sin conexión con la nube. Trabajando en local, no se sobreescribirá nada.');
    authShow(false);
    refreshWallets();migrate({skipCloud:true});render();
    updateSyncInfo();
    setTimeout(()=>{onLoggedIn(user)},5000);
    return;
  }

  cloudReady=true;
  if(res.data){
    // Hay datos en la nube: fuente de verdad entre dispositivos
    db=Object.assign(defaultDB(),res.data);
    saveLocal(db);
  }else{
    // Usuario nuevo REAL (ok:true,data:null): solo subir si hay algo local
    if(!dbIsEmpty(db)) await pushCloud(db);
  }
  authError('');
  refreshWallets();migrate();
  authShow(false);
  render();syncPrices(false);
  updateSyncInfo();
}

// ===================== STATE =====================
let state={view:'portfolio',subTab:'my',selWallet:'wallet1',poolFilter:'all',detailId:null,compView:localStorage.getItem('crmcrypto_compView')||'donut',evoRange:'all',walletEvoRange:'all'};
const COLORS=['#4f8cff','#22c55e','#f97316','#a855f7','#ec4899','#06b6d4','#eab308','#ef4444','#8b5cf6','#14b8a6','#f43f5e','#6366f1','#84cc16','#0ea5e9'];
const CG_MAP={BTC:'bitcoin',ETH:'ethereum',SOL:'solana',BNB:'binancecoin',USDC:'usd-coin',USDT:'tether',MATIC:'matic-network',AVAX:'avalanche-2',ARB:'arbitrum',OP:'optimism',WBTC:'wrapped-bitcoin',WETH:'weth',HYPE:'hyperliquid',XRP:'ripple',SUI:'sui',LINK:'chainlink',UNI:'uniswap',AAVE:'aave',CRV:'curve-dao-token',DOGE:'dogecoin',ADA:'cardano',DOT:'polkadot',ATOM:'cosmos',FTM:'fantom',NEAR:'near',APT:'aptos',SEI:'sei-network',TIA:'celestia',JUP:'jupiter-exchange-solana',WIF:'dogwifcoin',PEPE:'pepe',RENDER:'render-token',FET:'artificial-superintelligence-alliance',TAO:'bittensor',INJ:'injective-protocol',TRX:'tron',TON:'the-open-network',SHIB:'shiba-inu',LTC:'litecoin',BCH:'bitcoin-cash',STX:'blockstack',MKR:'maker',PENDLE:'pendle',ENA:'ethena',W:'wormhole',STRK:'starknet',EIGEN:'eigenlayer',CBBTC:'coinbase-wrapped-btc',CBETH:'coinbase-wrapped-staked-eth',AERO:'aerodrome-finance',VIRTUAL:'virtual-protocol',AI16Z:'ai16z',BERA:'berachain',KAITO:'kaito',CAKE:'pancakeswap-token',XLM:'stellar',ALGO:'algorand'};

// ===================== UTILS =====================
const $=s=>document.querySelector(s);
// Escapa texto del usuario antes de meterlo en innerHTML (evita XSS). Vale para texto y para atributos entre comillas.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function togglePrivacy(){privacy=!privacy;localStorage.setItem('crmcrypto_privacy',privacy?'1':'0');syncPrivBtn();render()}
function syncPrivBtn(){const b=$('#privBtn');if(b){b.textContent=privacy?'🙈':'👁';b.title=privacy?'Mostrar importes':'Ocultar importes'}}
const fmt=n=>{if(privacy)return'$•••••';if(n==null||isNaN(n))return'$0.00';let a=Math.abs(n);if(a>=1e6)return(n<0?'-':'')+'$'+(a/1e6).toFixed(2)+'M';if(a>=1e3)return(n<0?'-':'')+'$'+a.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});return(n<0?'-':'')+'$'+a.toFixed(2)};
const fmtP=n=>{if(n==null||isNaN(n))return'0.00';return n.toFixed(2)};
const fmtPct=n=>(n>=0?'+':'')+fmtP(n)+'%';
const fmtQty=n=>{if(privacy)return'•••';if(n==null)return'0';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return n.toLocaleString('en',{maximumFractionDigits:4});if(n>=1)return n.toFixed(4);return n.toFixed(6)};
const fmtPrice=n=>{if(n>=100)return'$'+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=1)return'$'+n.toFixed(4);return'$'+n.toFixed(6)};
const pnlClass=n=>n>=0?'pnl-pos':'pnl-neg';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const daysBetween=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/864e5));
const today=()=>new Date().toISOString().slice(0,10);

// Migrate purchases
function migrate(opts){
  opts=opts||{};
  if(!db.snapshots)db.snapshots=[];
  db.assets.forEach(a=>{
    if(a.id!=null)a.id=String(a.id);
    if(a.symbol)a.symbol=a.symbol.toUpperCase();
    (a.purchases||[]).forEach(pu=>{if(pu.id!=null)pu.id=String(pu.id)});
    if(!a.purchases){
      a.purchases=[{id:uid(),qty:+a.qty||0,price:+a.buyPrice||0,date:a.dateAdded||today()}];
    }
    recalcAsset(a);
  });
  db.positions.forEach(p=>{
    if(p.id!=null)p.id=String(p.id);
    (p.rewards||[]).forEach(r=>{if(r.id!=null)r.id=String(r.id)});
    p.version='v3';
    if(!p.rangeAlertPct)p.rangeAlertPct=5;
    if(p.rangeAlertLow==null)p.rangeAlertLow=+p.rangeAlertPct||5;
    if(p.rangeAlertHigh==null)p.rangeAlertHigh=+p.rangeAlertPct||5;
    if(p.curTaQty==null)p.curTaQty=p.taQty||0;
    if(p.curTbQty==null)p.curTbQty=p.tbQty||0;
    if(!p.rewards)p.rewards=[];
    const oldClaimed=+p.v3FeesClaimed||0,oldPending=+p.v3FeesPending||0;
    if(oldClaimed&&!p.rewards.some(r=>r.id==='migrated_v3_claimed')){
      p.rewards.push({id:'migrated_v3_claimed',usd:oldClaimed,date:p.dateIn||today(),state:'retirado'});
    }
    if(oldPending&&!p.rewards.some(r=>r.id==='migrated_v3_pending')){
      p.rewards.push({id:'migrated_v3_pending',usd:oldPending,date:p.dateIn||today(),state:'pendiente'});
    }
    p.v3FeesClaimed=0;p.v3FeesPending=0;
  });
  if(opts.skipCloud){saveLocal(db)}else{saveDB(db)}
}
function recalcAsset(a){
  if(!a.purchases||!a.purchases.length){a.qty=0;a.buyPrice=0;return}
  let tq=0,tv=0;
  a.purchases.forEach(p=>{const q=+p.qty||0,pr=+p.price||0;tq+=q;tv+=q*pr});
  a.qty=tq;a.buyPrice=tq>0?tv/tq:0;
}
// NOTA: migrate() de arranque eliminado a propósito. Ahora corre dentro de
// onLoggedIn/init con el DB correcto, evitando subir datos a la nube antes de tiempo.

// ===================== COINGECKO =====================
const cgMiss=new Set(); // símbolos ya buscados sin resultado en esta sesión (evita repetir llamadas)
async function cgResolve(sym){
  const s=(sym||'').toUpperCase();
  if(CG_MAP[s])return CG_MAP[s];
  if(cgMiss.has(s)||!s)return null;
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(s));
    const d=await r.json();
    const hit=(d.coins||[]).find(c=>(c.symbol||'').toUpperCase()===s);
    if(hit)return hit.id;
  }catch(e){}
  cgMiss.add(s);
  return null;
}
async function syncPrices(force){
  const now=Date.now();
  if(!force&&db.lastSync&&now-db.lastSync<600000)return;
  // Vincula cada activo a su id de CoinGecko (mapa conocido o búsqueda, una vez por símbolo)
  for(const a of db.assets){
    if(!a.cgId){const id=await cgResolve(a.symbol);if(id)a.cgId=id}
  }
  const ids=new Set();
  db.assets.forEach(a=>{if(a.cgId)ids.add(a.cgId)});
  db.positions.forEach(p=>{
    [p.taSymbol,p.tbSymbol].forEach(sym=>{const cg=CG_MAP[(sym||'').toUpperCase()];if(cg)ids.add(cg)});
  });
  if(!ids.size)return;
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=250&ids='+[...ids].join(',')+'&price_change_percentage=24h,7d');
    const arr=await r.json();
    const d={};(Array.isArray(arr)?arr:[]).forEach(c=>d[c.id]=c);
    db.assets.forEach(a=>{
      const c=d[a.cgId];
      if(c){
        if(c.current_price!=null)a.price=c.current_price;
        if(c.image)a.img=c.image;
        a.chg24=c.price_change_percentage_24h;
        a.chg7d=c.price_change_percentage_7d_in_currency;
      }
    });
    db.positions.forEach(p=>{
      const taCg=CG_MAP[(p.taSymbol||'').toUpperCase()],tbCg=CG_MAP[(p.tbSymbol||'').toUpperCase()];
      if(taCg&&d[taCg]&&d[taCg].current_price!=null)p.taCurPrice=d[taCg].current_price;
      if(tbCg&&d[tbCg]&&d[tbCg].current_price!=null)p.tbCurPrice=d[tbCg].current_price;
      refreshPoolValue(p);
    });
    captureSnapshot();
    db.lastSync=Date.now();saveDB(db);render();
  }catch(e){console.warn('Sync failed',e)}
  updateSyncInfo();
}
function updateSyncInfo(){
  const el=$('#syncInfo');if(!el)return;
  const cloud=cloudReady&&sbUser?' ☁':'';
  if(db.lastSync){const m=Math.round((Date.now()-db.lastSync)/60000);el.textContent=(m<1?'Sync: ahora':'Sync: hace '+m+' min')+cloud}
  else el.textContent='Sin sync'+cloud;
}

// ===================== PORTFOLIO =====================
function getWalletAssets(wid){return db.assets.filter(a=>a.wallet===wid)}
function assetVal(a){return(a.qty||0)*(a.price||0)}
function assetPnl(a){return a.qty*(a.price-a.buyPrice)}
function walletHodl(wid){return getWalletAssets(wid).reduce((s,a)=>s+assetVal(a),0)}
function walletDefi(wid){return db.positions.filter(p=>p.wallet===wid&&p.status==='active').reduce((s,p)=>s+poolCurrentVal(p),0)}
function walletRewards(wid){return db.positions.filter(p=>p.wallet===wid).reduce((s,p)=>s+poolIncome(p),0)}
// Coste invertido conocido de la wallet (HODL con precio de compra + capital DeFi activo). Ignora activos sin coste.
function walletCost(wid){
  const hc=getWalletAssets(wid).reduce((s,a)=>s+(a.buyPrice>0?a.qty*a.buyPrice:0),0);
  const dc=db.positions.filter(p=>p.wallet===wid&&p.status==='active').reduce((s,p)=>s+poolCap(p),0);
  return hc+dc;
}
// Rendimiento total de la wallet (solo activos con coste conocido + P&L de las pools).
function walletPnl(wid){
  const hp=getWalletAssets(wid).reduce((s,a)=>s+(a.buyPrice>0?(a.price-a.buyPrice)*a.qty:0),0);
  const dp=db.positions.filter(p=>p.wallet===wid).reduce((s,p)=>s+poolPnl(p),0);
  return hp+dp;
}
// HTML del rendimiento para la tarjeta de wallet (color + %, o "—" si no hay coste).
function walletPnlHtml(wid){
  const p=walletPnl(wid),c=walletCost(wid);
  if(!(c>0))return `<div class="wpnl" style="color:var(--tx3)">Rendimiento: —</div>`;
  return `<div class="wpnl ${pnlClass(p)}">${fmt(p)} (${fmtPct(p/c*100)})</div>`;
}
// Recuadro derecho de la tarjeta de wallet: reparto HODL vs DeFi de esa wallet.
function walletSplitHtml(wid){
  const hodl=walletHodl(wid),defi=walletDefi(wid),total=hodl+defi;
  const hPct=total?hodl/total*100:0,dPct=total?defi/total*100:0;
  return `<div class="wc-right">`+
    `<div class="wc-split"><span class="wcs-l">HODL</span><span class="wcs-v">${fmt(hodl)} <span class="wcs-pct">${fmtP(hPct)}%</span></span></div>`+
    `<div class="wc-split"><span class="wcs-l">DeFi</span><span class="wcs-v">${fmt(defi)} <span class="wcs-pct">${fmtP(dPct)}%</span></span></div>`+
  `</div>`;
}
function poolCap(p){return(p.taQty*p.taPrice)+(p.tbQty*p.tbPrice)}
function rewTotal(p){return(p.rewards||[]).reduce((s,r)=>s+(r.state==='reinvertido'?0:(+r.usd||0)),0)}
function reinvestedRewards(p){return(p.rewards||[]).reduce((s,r)=>s+(r.state==='reinvertido'?(+r.usd||0):0),0)}
function rewardPending(p){return(p.rewards||[]).reduce((s,r)=>s+(r.state==='pendiente'?(+r.usd||0):0),0)}
function rewardClaimed(p){return(p.rewards||[]).reduce((s,r)=>s+(r.state==='retirado'?(+r.usd||0):0),0)}
function poolIncome(p){return rewTotal(p)}
function tokenUsdPrice(sym,fallback,p){
  const s=(sym||'').toUpperCase();
  const stable=['USDC','USDT','DAI','USDS','PYUSD','EURC'];
  if(stable.includes(s))return 1;
  if(p&&(p.taSymbol||'').toUpperCase()===s&&+p.taCurPrice>0)return+p.taCurPrice;
  if(p&&(p.tbSymbol||'').toUpperCase()===s&&+p.tbCurPrice>0)return+p.tbCurPrice;
  const a=db.assets.find(x=>(x.symbol||'').toUpperCase()===s&&+x.price>0);
  return a?+a.price:(+fallback||0);
}
function poolTokenPrice(p,side){return side==='a'?tokenUsdPrice(p.taSymbol,p.taPrice,p):tokenUsdPrice(p.tbSymbol,p.tbPrice,p)}
function poolCurrentVal(p){
  const qa=+p.curTaQty||0,qb=+p.curTbQty||0;
  const val=(qa*poolTokenPrice(p,'a'))+(qb*poolTokenPrice(p,'b'));
  return val>0?val:(+p.curVal||0);
}
function refreshPoolValue(p){p.curVal=poolCurrentVal(p)}
// ¿El token tiene cotización en vivo? (stable, en CoinGecko, o ya con precio en assets)
function tokenHasFeed(sym){
  const s=(sym||'').toUpperCase();
  return ['USDC','USDT','DAI','USDS','PYUSD','EURC'].includes(s)||!!CG_MAP[s]||db.assets.some(x=>(x.symbol||'').toUpperCase()===s&&+x.price>0);
}
function v3CurrentPrice(p){
  // Si ambos tokens cotizan en vivo, usamos el precio REAL de mercado → la barra se mueve sola.
  if(tokenHasFeed(p.taSymbol)&&tokenHasFeed(p.tbSymbol)){
    const ta=poolTokenPrice(p,'a'),tb=poolTokenPrice(p,'b');
    if(ta>0&&tb>0)return ta/tb;
  }
  // Respaldo para tokens sin cotización: el precio manual que introdujo el usuario.
  return +p.curPriceAB||0;
}
function v3RangeInfo(p){
  const price=v3CurrentPrice(p),a=+p.rangeMin||0,b=+p.rangeMax||0;
  if(!price||!a||!b)return{ready:false,status:'unknown',label:'Sin rango',price};
  const min=Math.min(a,b),max=Math.max(a,b);
  const alertLow=+p.rangeAlertLow||+p.rangeAlertPct||5,alertHigh=+p.rangeAlertHigh||+p.rangeAlertPct||5;
  if(max<=min)return{ready:false,status:'unknown',label:'Rango inválido',price,min,max};
  const pos=Math.max(0,Math.min(100,((price-min)/(max-min))*100));
  const width=((max-min)/((min+max)/2))*100;
  if(price<min){
    const d=((min-price)/price)*100;
    return{ready:true,status:'out',label:'Fuera por abajo',price,min,max,pos:0,distance:d,width,alert:alertLow};
  }
  if(price>max){
    const d=((price-max)/price)*100;
    return{ready:true,status:'out',label:'Fuera por arriba',price,min,max,pos:100,distance:d,width,alert:alertHigh};
  }
  const dLow=(price-min)/price*100,dHigh=(max-price)/price*100;
  const nearestLow=dLow<=dHigh;
  const distance=nearestLow?dLow:dHigh,alert=nearestLow?alertLow:alertHigh;
  const near=(dLow<=alertLow)||(dHigh<=alertHigh);
  return{ready:true,status:near?'near':'in',label:near?'Cerca del borde':'En rango',price,min,max,pos,distance,width,alert};
}
function v3FeeApr(p){
  const cap=poolCap(p),fees=poolIncome(p),d=poolDays(p);
  return cap&&d?fees/cap*365/d*100:0;
}
function v3DepositAmountsFromUsd(p,usd){
  usd=+usd||0;if(usd<=0)return{ta:0,tb:0};
  const pa=poolTokenPrice(p,'a'),pb=poolTokenPrice(p,'b'),price=v3CurrentPrice(p);
  const min=Math.min(+p.rangeMin||0,+p.rangeMax||0),max=Math.max(+p.rangeMin||0,+p.rangeMax||0);
  if(!pa||!pb)return{ta:0,tb:0};
  if(!price||!min||!max||max<=min){
    const cur=poolCurrentVal(p),taVal=(+p.curTaQty||0)*pa,taShare=cur?taVal/cur:0.5;
    return{ta:(usd*taShare)/pa,tb:(usd*(1-taShare))/pb};
  }
  if(price<=min)return{ta:usd/pa,tb:0};
  if(price>=max)return{ta:0,tb:usd/pb};
  const sp=Math.sqrt(price),sl=Math.sqrt(min),su=Math.sqrt(max);
  const taUnit=(su-sp)/(sp*su),tbUnit=sp-sl;
  const unitValue=taUnit*pa+tbUnit*pb;
  if(unitValue<=0)return{ta:usd/(pa*2),tb:usd/(pb*2)};
  const liq=usd/unitValue;
  return{ta:taUnit*liq,tb:tbUnit*liq};
}
function applyReinvestedReward(p,r,sign){
  if(!p||!r||r.state!=='reinvertido')return;
  if(sign<0&&!(+r.taQty||+r.tbQty))return;
  const amt=(+r.taQty||+r.tbQty)?{ta:+r.taQty||0,tb:+r.tbQty||0}:v3DepositAmountsFromUsd(p,+r.usd||0);
  r.taQty=amt.ta;r.tbQty=amt.tb;r.taPrice=poolTokenPrice(p,'a');r.tbPrice=poolTokenPrice(p,'b');
  p.curTaQty=(+p.curTaQty||0)+(sign*amt.ta);
  p.curTbQty=(+p.curTbQty||0)+(sign*amt.tb);
  refreshPoolValue(p);
}
function v3StatusBadge(p){
  const i=v3RangeInfo(p),cls=i.status==='out'?'badge-range-out':i.status==='near'?'badge-range-near':i.status==='in'?'badge-range-in':'badge-range-unknown';
  return `<span class="badge ${cls}">${i.label}</span>`;
}
function poolPnl(p){
  if(p.status==='closed'){return((p.exitTaQty*p.exitTaPrice)+(p.exitTbQty*p.exitTbPrice))+(+p.exitFees||0)+poolIncome(p)-poolCap(p)}
  return poolCurrentVal(p)+poolIncome(p)-poolCap(p);
}
function poolRoi(p){const c=poolCap(p);return c?poolPnl(p)/c*100:0}
function poolDays(p){return daysBetween(p.dateIn,p.dateOut||today())}
function poolExitVal(p){return(p.exitTaQty||0)*(p.exitTaPrice||0)+(p.exitTbQty||0)*(p.exitTbPrice||0)}

function renderMyPortfolio(){
  // Consolidate: wallet1 100%, wallet2 50%
  const map={};
  db.assets.forEach(a=>{
    const mult=a.wallet==='wallet1'?1:0.5;
    const k=a.symbol;
    if(!map[k])map[k]={symbol:a.symbol,name:a.name,price:a.price,img:a.img,chg24:a.chg24,chg7d:a.chg7d,qty:0,totalCost:0,wallet:'mixed',purchases:[],origins:[]};
    if(!map[k].img&&a.img)map[k].img=a.img;
    map[k].qty+=a.qty*mult;
    map[k].totalCost+=(a.qty*a.buyPrice)*mult;
    map[k].origins.push({wallet:a.wallet,pct:mult*100});
  });
  const assets=Object.values(map).map(a=>{a.buyPrice=a.qty>0?a.totalCost/a.qty:0;return a}).sort((a,b)=>(b.qty*b.price)-(a.qty*a.price));
  const hodl=assets.reduce((s,a)=>s+a.qty*a.price,0);
  const defiAll=db.positions.filter(p=>p.status==='active').reduce((s,p)=>{
    const m=p.wallet==='wallet1'?1:0.5;return s+poolCurrentVal(p)*m},0);
  const total=hodl+defiAll;
  const pnlHodl=assets.reduce((s,a)=>s+(a.buyPrice>0?(a.price-a.buyPrice)*a.qty:0),0);
  const pnlDefi=db.positions.reduce((s,p)=>{const m=p.wallet==='wallet1'?1:0.5;return s+poolPnl(p)*m},0);
  // Invertido (mi parte): coste HODL consolidado + capital DeFi activo
  const costHodl=assets.reduce((s,a)=>s+(a.totalCost||0),0);
  const costDefi=db.positions.filter(p=>p.status==='active').reduce((s,p)=>{const m=p.wallet==='wallet1'?1:0.5;return s+poolCap(p)*m},0);
  const invested=costHodl+costDefi;
  const pnlTotal=pnlHodl+pnlDefi;
  // Cambio 24h en $ reconstruido desde la variación de cada activo (HODL con dato de CoinGecko)
  let chg24Abs=0,prev24=0;
  assets.forEach(a=>{if(a.chg24!=null&&!isNaN(a.chg24)){const v=a.qty*a.price,pv=v/(1+a.chg24/100);chg24Abs+=v-pv;prev24+=pv}});
  const chg24Pct=prev24?chg24Abs/prev24*100:null;
  // Mejor activo: hoy (24h) e histórico (vs precio medio de compra)
  const best24=assets.filter(a=>a.chg24!=null&&!isNaN(a.chg24)&&a.qty>0).sort((a,b)=>b.chg24-a.chg24)[0];
  const topH=assets.filter(a=>a.buyPrice>0&&a.qty>0).map(a=>({sym:a.symbol,roi:(a.price-a.buyPrice)/a.buyPrice*100})).sort((a,b)=>b.roi-a.roi)[0];
  let h=`<div class="metrics m4">`;
  h+=`<div class="metric hero"><div class="label">Saldo actual</div><div class="val">${fmt(total)}</div><div class="sub">HODL ${fmt(hodl)} + DeFi ${fmt(defiAll)}</div></div>`;
  if(chg24Pct==null)h+=`<div class="metric"><div class="label">Cambio cartera 24h</div><div class="val sm" style="color:var(--tx3)">—</div><div class="sub">Pulsa ↻ para sincronizar</div></div>`;
  else h+=`<div class="metric"><div class="label">Cambio cartera 24h</div><div class="val sm ${pnlClass(chg24Abs)}">${fmt(chg24Abs)} <span style="font-size:.82rem">${chg24Abs>=0?'▲':'▼'} ${fmtP(Math.abs(chg24Pct))}%</span></div><div class="sub">Variación 24h de tus activos HODL</div></div>`;
  h+=`<div class="metric"><div class="label">Total ganancias/pérdidas</div><div class="val sm ${pnlClass(pnlTotal)}">${fmt(pnlTotal)} <span style="font-size:.8rem">${invested>0?fmtPct(pnlTotal/invested*100):''}</span></div><div class="sub">Invertido ${fmt(invested)} · HODL ${fmt(pnlHodl)} / DeFi ${fmt(pnlDefi)}</div></div>`;
  h+=`<div class="metric" style="border-color:#eab30840;background:linear-gradient(135deg,#eab30810,#eab30803)"><div class="label">Mejor rendimiento</div>`;
  if(best24){
    const ico=best24.img?`<img class="asset-ico" src="${esc(best24.img)}" alt="" style="width:18px;height:18px;vertical-align:-3px;margin-right:4px">`:'';
    h+=`<div class="val sm">${ico}${esc(best24.symbol)} <span class="${pnlClass(best24.chg24)}">${fmtPct(best24.chg24)}</span> <span style="font-size:.72rem;color:var(--tx3)">24h</span></div>`;
  }else h+=`<div class="val sm" style="color:var(--tx3)">—</div>`;
  if(topH)h+=`<div class="sub">🏆 Histórico: ${esc(topH.sym)} ${fmtPct(topH.roi)} desde compra</div>`;
  h+=`</div></div>`;
  // Quesito + gráfica lado a lado (como CoinGecko)
  h+=`<div class="panels">`;
  h+=renderPanels(assets,total,hodl,defiAll,'chart_my');
  h+=renderMiniEvo();
  h+=`</div>`;
  h+=renderAssetTable(assets,true);
  return h;
}

  assets.forEach((a,i)=>{
    const v=assetVal(a);const cost=a.qty*a.buyPrice;const pnl=(a.price-a.buyPrice)*a.qty;const roi=cost?(pnl/cost*100):0;
    const hasCost=a.buyPrice>0&&a.qty>0;
    const ico=a.img?`<img class="asset-ico" src="${esc(a.img)}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="asset-dot" style="background:${COLORS[i%COLORS.length]}"></div>`;
    h+=`<tr><td><div class="asset-cell">${ico}<div><div class="asset-sym">${esc(a.symbol)}</div><div class="asset-name">${esc(a.name||'')}</div></div></div></td>`;
    h+=`<td>${fmtQty(a.qty)}</td>`;
    h+=`<td>${fmtPrice(a.price)}<div class="price-sub">Precio medio: ${hasCost?fmtPrice(a.buyPrice):'—'}</div></td>`;
    h+=`<td style="font-weight:600">${fmt(v)}</td>`;
    h+=chgCell(a.chg24)+chgCell(a.chg7d);

  if(state.subTab==='my'&&document.getElementById('miniEvo')){

  }
  if(state.subTab==='all'&&document.getElementById('walletEvo')){
    drawEvoChart(valueSeriesForChart(state.selWallet),state.walletEvoRange||'all','walletEvo');
    ensureRealSeries(state.selWallet);
  }
  const ids=state.subTab==='all'?['chart_all']:['chart_my'];
  ids.forEach(id=>{
    const c=document.getElementById(id);if(!c)return;
    const ctx=c.getContext('2d');
    const assets=(state.subTab==='all'?getWalletAssets(state.selWallet):getConsolidatedAssets()).slice().sort((a,b)=>(b.qty*b.price)-(a.qty*a.price));
    const total=assets.reduce((s,a)=>s+a.qty*a.price,0);
    drawDonut(ctx,assets.map((a,i)=>({val:a.qty*a.price,color:COLORS[i%COLORS.length]})),total,200);

}
function getConsolidatedAssets(){
  const map={};
  db.assets.forEach(a=>{const m=a.wallet==='wallet1'?1:0.5;const k=a.symbol;if(!map[k])map[k]={symbol:a.symbol,name:a.name,price:a.price,qty:0,totalCost:0};map[k].qty+=a.qty*m;map[k].totalCost+=(a.qty*a.buyPrice)*m});
  return Object.values(map).map(a=>{a.buyPrice=a.qty>0?a.totalCost/a.qty:0;return a});
}
function drawDonut(ctx,data,total,size){
  ctx.clearRect(0,0,size*2,size*2);
  if(!data.length||!total)return;
  const cx=size,cy=size,r=size*0.82,w=size*0.20;
  const segs=data.filter(d=>d.val>0).length;
  const gap=segs>1?0.05:0; // hueco angular entre activos (rad)
  let startAngle=-Math.PI/2;
  data.forEach(d=>{
    const sweep=(d.val/total)*Math.PI*2;
    if(d.val>0){
      const a0=startAngle+gap/2,a1=startAngle+sweep-gap/2;
      if(a1>a0){
        ctx.beginPath();ctx.arc(cx,cy,r,a0,a1);
        ctx.arc(cx,cy,r-w,a1,a0,true);
        ctx.closePath();ctx.fillStyle=d.color;ctx.fill();
      }
    }
    startAngle+=sweep;
  });
}

function renderPools(app){
  const f=state.poolFilter;
  const st=state.poolStatus||'active';
  const byWallet=f==='all'?db.positions:db.positions.filter(p=>p.wallet===f);
  const nAct=byWallet.filter(p=>p.status==='active').length;
  const nClosed=byWallet.filter(p=>p.status==='closed').length;
  let pools=byWallet.filter(p=>st==='closed'?p.status==='closed':p.status!=='closed');
  if(st!=='closed'){
    // Las activas se ordenan por urgencia: fuera de rango → cerca del borde → en rango
    const ord={out:0,near:1,in:2,unknown:3};
    pools=pools.slice().sort((a,b)=>ord[v3RangeInfo(a).status]-ord[v3RangeInfo(b).status]);
  }
  const cnt=w=>db.positions.filter(p=>w==='all'||p.wallet===w).length;
  let h=`<div class="fade-in"><div class="pool-filters">`;
  h+=`<button class="pill ${f==='all'?'active':''}" onclick="state.poolFilter='all';render()">Todas (${cnt('all')})</button>`;
  ['wallet1','wallet2'].forEach(w=>{
    h+=`<button class="pill ${f===w?'active':''}" onclick="state.poolFilter='${w}';render()">${esc(WALLETS[w].name)} (${cnt(w)})</button>`;
  });

  h+=`<div class="tabs" style="margin-bottom:16px">`;

  h+=`<button class="tab ${st==='closed'?'active':''}" onclick="state.poolStatus='closed';render()">Cerradas (${nClosed})</button>`;
  h+=`</div>`;
  const activeV3=pools.filter(p=>p.status==='active');
  if(activeV3.length){
    const inRange=activeV3.filter(p=>v3RangeInfo(p).status==='in').length;
    const nearRange=activeV3.filter(p=>v3RangeInfo(p).status==='near').length;
    const outRange=activeV3.filter(p=>v3RangeInfo(p).status==='out').length;

    h+=`<div class="metrics m4">`;
    h+=`<div class="metric"><div class="label">V3 en rango</div><div class="val sm pnl-pos">${inRange}</div></div>`;
    h+=`<div class="metric"><div class="label">Cerca del borde</div><div class="val sm ${nearRange?'pnl-neg':''}">${nearRange}</div></div>`;
    h+=`<div class="metric"><div class="label">Fuera de rango</div><div class="val sm ${outRange?'pnl-neg':''}">${outRange}</div></div>`;
    h+=`<div class="metric"><div class="label">Rewards pendientes</div><div class="val sm">${fmt(pendingFees)}</div></div>`;
    h+=`</div>`;
  }
  if(!pools.length){
    if(st==='closed')h+=`<div class="empty"><div class="e-icon">📦</div><div class="e-title">Sin posiciones cerradas</div><div>Cuando cierres una pool, su historial quedará aquí</div></div>`;
    else h+=`<div class="empty"><div class="e-icon">🌊</div><div class="e-title">Sin posiciones activas</div><div>${nClosed?'Tienes '+nClosed+' en la pestaña Cerradas · ':''}Pulsa "+ Nueva posición" para empezar</div></div>`;
  }
  else{
    h+=`<div class="pool-list">`;
    pools.forEach(p=>{
      const cap=poolCap(p),pnl=poolPnl(p),roi=poolRoi(p);
      const hasPending=(p.rewards||[]).some(r=>r.state==='pendiente');
      const rangeInfo=v3RangeInfo(p);
      const v3Class=p.status==='active'?(rangeInfo.status==='out'?'out-range':rangeInfo.status==='near'?'near-range':''):'';
      const statusClass=p.status==='closed'?'closed':hasPending?'rewards':v3Class;
      const badge=p.status==='closed'?'<span class="badge badge-closed">Cerrada</span>':hasPending?'<span class="badge badge-rewards">Rewards pendientes</span>':'<span class="badge badge-active">Activa</span>';

  app.innerHTML=h;
}

function renderDetail(app){
  const p=db.positions.find(x=>x.id===state.detailId);

  const cap=poolCap(p),pnl=poolPnl(p),roi=poolRoi(p),days=poolDays(p);

    h+=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Valor HODL (tokens entrada × precio salida)</span><span style="font-weight:600">${fmt(holdVal)}</span></div>`;
    h+=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Valor pool (tokens salida)</span><span style="font-weight:600">${fmt(ev)}</span></div>`;

    const diff=defiTotal-holdVal;
    h+=`<div class="detail-section"><h3>🤔 ¿Mereció la pena?</h3><div class="comparison">`;
    h+=`<div class="comp-card"><h4>Si hubieras hecho HODL</h4><div class="cv">${fmt(holdVal)}</div><div style="font-size:.82rem;color:var(--tx3);margin-top:4px">Tokens al precio de salida</div></div>`;

    h+=`<div class="verdict ${diff>=0?'pos':'neg'}">${diff>=0?'✅ La pool generó':'❌ La pool perdió'} ${fmt(Math.abs(diff))} vs HODL</div></div>`;
    // Rebalance

  }
  if(!isClosed)h+=renderV3Detail(p); // en pools cerradas el control V3 ya no aporta: cuentan la salida, el IL y el veredicto
  // Rewards table
  h+=`<div class="detail-section card"><h3>🎁 Rewards reclamados</h3>`;

  else{
    h+=`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Importe</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>`;
    (p.rewards||[]).forEach(r=>{

    });
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;
  // Actions
  h+=`<div class="action-bar">`;
  if(!isClosed){
    h+=`<button class="btn btn-primary" onclick="openRewardModal('${p.id}')">+ Reward</button>`;
    h+=`<button class="btn btn-secondary" onclick="openEditPool('${p.id}')">✎ Editar</button>`;
    h+=`<button class="btn btn-warning" onclick="closePosition('${p.id}')">Cerrar posición →</button>`;
  }else{
    h+=`<button class="btn btn-secondary" onclick="openEditPool('${p.id}')">✎ Editar datos</button>`;
  }
  h+=`<button class="btn btn-danger" onclick="confirmDeletePool('${p.id}')">Eliminar</button></div>`;
  if(!isClosed)h+=`<div class="hint">Cerrar posición guarda en historial · Eliminar borra sin rastro</div>`;
  h+=`</div>`;
  app.innerHTML=h;
}

// ===================== EVOLUCIÓN =====================
const dateMs=d=>new Date((d||today())+'T00:00:00').getTime();
// Totales actuales del portfolio (HODL + DeFi activo), todas las wallets al 100%
function portfolioTotals(){
  let value=0,cost=0;
  db.assets.forEach(a=>{value+=assetVal(a);cost+=(a.qty||0)*(a.buyPrice||0)});
  db.positions.forEach(p=>{if(p.status==='active'){value+=poolCurrentVal(p);cost+=poolCap(p)}});
  return {value,cost};
}
// Guarda una foto del valor/coste de hoy (una por día; si ya hay, la actualiza)
function captureSnapshot(){
  if(!db.snapshots)db.snapshots=[];
  const t=portfolioTotals();
  if(!(t.value>0))return;
  const d=today(),ex=db.snapshots.find(s=>s.date===d);
  if(ex){ex.value=t.value;ex.cost=t.cost}else db.snapshots.push({date:d,value:t.value,cost:t.cost});
}
// Línea de COSTE acumulado, reconstruida desde todo el historial (exacta, sin API)
// wid opcional: limita el cálculo a una sola wallet
function buildCostSeries(wid){
  const evts=[];
  const assetsList=wid?db.assets.filter(a=>a.wallet===wid):db.assets;
  const posList=wid?db.positions.filter(p=>p.wallet===wid):db.positions;
  assetsList.forEach(a=>(a.purchases||[]).forEach(p=>evts.push({date:p.date||today(),d:(+p.qty||0)*(+p.price||0)})));
  posList.forEach(p=>{
    if(p.dateIn)evts.push({date:p.dateIn,d:poolCap(p)});
    if(p.status==='closed'&&p.dateOut)evts.push({date:p.dateOut,d:-poolCap(p)});
  });
  evts.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let cum=0;const pts=[];
  evts.forEach(e=>{cum+=e.d;const t=dateMs(e.date);const last=pts[pts.length-1];if(last&&last.t===t)last.v=cum;else pts.push({t,v:cum})});
  return pts;
}
// Línea de VALOR de mercado: snapshots guardados + el valor en vivo de hoy
// wid opcional: no hay snapshots por wallet, así que solo aporta el punto vivo de esa wallet hoy
function buildValueSeries(wid){
  if(wid){const v=walletHodl(wid)+walletDefi(wid);return v>0?[{t:dateMs(today()),v}]:[]}
  const pts=(db.snapshots||[]).filter(s=>s.value>0).map(s=>({t:dateMs(s.date),v:s.value}));
  const t=portfolioTotals();
  if(t.value>0){const tm=dateMs(today()),last=pts[pts.length-1];if(last&&last.t===tm)last.v=t.value;else pts.push({t:tm,v:t.value})}
  pts.sort((a,b)=>a.t-b.t);
  return pts;
}
function evoCutoff(range){const now=Date.now(),d=864e5;if(range==='1m')return now-30*d;if(range==='3m')return now-90*d;if(range==='1y')return now-365*d;return 0}

// ===================== SERIE HISTÓRICA DE VALOR =====================
// Reconstruye "valor del portfolio en el tiempo" desde la primera compra:
//  · último año: precios diarios reales de CoinGecko (límite del API gratuito)
//  · más antiguo: aproximación con tus precios de compra
const STABLES=['USDC','USDT','DAI','USDS','PYUSD','EURC'];
const histPriceCache={};
// Cachés keyed por wallet ('global' = consolidado de todas)
let realSeriesCache={},realSeriesLoading={};
async function fetchCoinHistory(id){
  if(histPriceCache[id])return histPriceCache[id];
  try{
    const r=await fetch(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(id)}/market_chart?vs_currency=usd&days=365&interval=daily`);
    const d=await r.json();
    const pts=(d.prices||[]).map(p=>({t:p[0],v:p[1]}));
    if(pts.length){histPriceCache[id]=pts;return pts}
  }catch(e){}
  return null;
}
// Histórico de bolsa (acciones/ETFs) vía Twelve Data. Devuelve [{t,v}] ascendente, igual que fetchCoinHistory.
// Plan gratuito: ~5000 velas diarias (≈20 años) y 800 req/día. La key va en el cliente (app personal).
const TWELVE_KEY='f62b9ebd431a4abaaff7c68a7e5a4f4d';
const stockHistCache={};
async function fetchStockHistory(symbol){
  if(stockHistCache[symbol])return stockHistCache[symbol];
  try{
    const r=await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=1day&outputsize=5000&apikey=${TWELVE_KEY}`);
    const d=await r.json();
    if(d.status==='ok'&&Array.isArray(d.values)){
      const pts=d.values.map(x=>({t:dateMs(x.datetime),v:+x.close})).filter(p=>p.v>0).sort((a,b)=>a.t-b.t);
      if(pts.length){stockHistCache[symbol]=pts;return pts}
    }
  }catch(e){}
  return null;
}
function seriesPriceAt(s,t){let v=null;for(let i=0;i<s.length;i++){if(s[i].t<=t)v=s[i].v;else break}return v}
// Serie inmediata mientras carga el histórico: coste acumulado (proxy del valor en cada compra) + fotos diarias + valor vivo
function fallbackValueSeries(wid){
  const snaps=buildValueSeries(wid);
  const firstSnap=snaps.length?snaps[0].t:Infinity;
  return buildCostSeries(wid).filter(p=>p.t<firstSnap).concat(snaps);
}
function valueSeriesForChart(wid){return realSeriesCache[wid||'global']||fallbackValueSeries(wid)}
function ensureRealSeries(wid){
  const key=wid||'global';
  if(realSeriesCache[key]||realSeriesLoading[key])return;
  realSeriesLoading[key]=true;
  buildRealValueSeries(wid).then(s=>{
    realSeriesLoading[key]=false;
    if(s&&s.length){
      realSeriesCache[key]=s;
      if(wid){
        if(document.getElementById('walletEvo'))drawEvoChart(valueSeriesForChart(wid),state.walletEvoRange||'all','walletEvo');
      }else{
        if(document.getElementById('miniEvo'))drawEvoChart(valueSeriesForChart(),state.evoRange||'all','miniEvo');
        if(document.getElementById('evoChart'))drawEvoChart(valueSeriesForChart(),state.evoRange||'all','evoChart');
      }
    }
  }).catch(()=>{realSeriesLoading[key]=false});
}
// wid opcional: reconstruye la serie de valor de una sola wallet (al 100%, sin consolidar)
async function buildRealValueSeries(wid){
  const assetsList=wid?db.assets.filter(a=>a.wallet===wid):db.assets;
  const posList=wid?db.positions.filter(p=>p.wallet===wid):db.positions;
  const need=new Set();
  assetsList.forEach(a=>{if(a.cgId&&!STABLES.includes(a.symbol))need.add(a.cgId)});
  posList.forEach(p=>{[p.taSymbol,p.tbSymbol].forEach(s=>{const S=(s||'').toUpperCase();if(S&&!STABLES.includes(S)&&CG_MAP[S])need.add(CG_MAP[S])})});
  const hist={};let ok=0;
  for(const id of need){const h=await fetchCoinHistory(id);if(h){hist[id]=h;ok++}}
  if(need.size&&!ok)return null; // API caída o sin cuota: seguimos con el fallback
  // Primera compra / entrada en pool de todo el historial
  let firstT=Infinity;
  assetsList.forEach(a=>(a.purchases||[]).forEach(pu=>{const t=dateMs(pu.date||today());if(t<firstT)firstT=t}));
  posList.forEach(p=>{if(p.dateIn){const t=dateMs(p.dateIn);if(t<firstT)firstT=t}});
  if(firstT===Infinity)return null;
  const wstart=Object.keys(hist).length?Math.min(...Object.values(hist).map(s=>s[0].t)):Date.now()-365*864e5;
  const start=Math.max(wstart,firstT),end=dateMs(today());
  const pts=[];
  // Tramo anterior a la ventana de precios: coste acumulado como aproximación del valor
  if(firstT<start)buildCostSeries(wid).forEach(p=>{if(p.t<start)pts.push({t:p.t,v:p.v})});
  for(let t=start;t<=end;t+=864e5){
    let v=0;
    assetsList.forEach(a=>{
      let q=0;(a.purchases||[]).forEach(pu=>{if(dateMs(pu.date||today())<=t)q+=(+pu.qty||0)});
      if(!(q>0))return;
      let pr=null;
      if(STABLES.includes(a.symbol))pr=1;
      else if(a.cgId&&hist[a.cgId])pr=seriesPriceAt(hist[a.cgId],t);
      if(pr==null){ // sin histórico: último precio de compra conocido hasta esa fecha
        let last=0;(a.purchases||[]).forEach(pu=>{if(dateMs(pu.date||today())<=t&&+pu.price>0)last=+pu.price});
        pr=last||a.buyPrice||0;
      }
      v+=q*pr;
    });
    posList.forEach(p=>{
      if(!p.dateIn||t<dateMs(p.dateIn))return;
      if(p.status==='closed'&&p.dateOut&&t>=dateMs(p.dateOut))return; // al cerrar, los tokens vuelven al HODL y ya cuentan arriba
      [[p.taSymbol,+p.curTaQty||+p.taQty||0,+p.taPrice||0],[p.tbSymbol,+p.curTbQty||+p.tbQty||0,+p.tbPrice||0]].forEach(([sym,q,entryPr])=>{
        const S=(sym||'').toUpperCase();if(!q)return;
        let pr=null;
        if(STABLES.includes(S))pr=1;
        else if(CG_MAP[S]&&hist[CG_MAP[S]])pr=seriesPriceAt(hist[CG_MAP[S]],t);
        if(pr==null)pr=entryPr;
        v+=q*pr;
      });
    });
    pts.push({t,v});
  }
  // El punto final es el valor vivo de ahora mismo
  const live=wid?{value:walletHodl(wid)+walletDefi(wid)}:portfolioTotals();
  if(live.value>0&&pts.length)pts[pts.length-1]={t:end,v:live.value};
  return pts.filter(p=>p.v>0);
}

// ===================== BENCHMARK =====================
// Simula: "si cada aportación tuya se hubiera invertido ese mismo día en X, ¿cuánto tendrías hoy?"
// Hasta 3 activos configurables (cripto vía CoinGecko o bolsa vía Twelve Data). Guardados en localStorage.
function investEvents(){
  const evts=[];
  db.assets.forEach(a=>(a.purchases||[]).forEach(p=>{const usd=(+p.qty||0)*(+p.price||0);if(usd)evts.push({date:p.date||today(),usd})}));
  db.positions.forEach(p=>{
    if(p.dateIn)evts.push({date:p.dateIn,usd:poolCap(p)});
    if(p.status==='closed'&&p.dateOut)evts.push({date:p.dateOut,usd:-poolCap(p)});
  });
  return evts.sort((a,b)=>a.date<b.date?-1:1);
}
// Por defecto: los 3 clásicos. Koke puede cambiarlos o vaciarlos a su gusto.
const DEFAULT_BENCH_SLOTS=[
  {kind:'crypto',cgId:'bitcoin',symbol:'BTC',label:'Bitcoin',img:''},
  {kind:'stock',symbol:'SPY',label:'S&P 500 (SPY)',img:''},
  {kind:'crypto',cgId:'pax-gold',symbol:'PAXG',label:'Oro (PAXG)',img:''}
];
// Viven en db.config para que sincronicen entre dispositivos vía Supabase (no en localStorage).
// Se leen SIEMPRE en vivo: tras bajar de la nube, db se reasigna y una variable cacheada quedaría obsoleta.
function bSlots(){
  if(!db.config)db.config={};
  if(!Array.isArray(db.config.benchSlots)){
    let init=null; // migración una sola vez desde la versión anterior (localStorage)
    try{const s=JSON.parse(localStorage.getItem('crmcrypto_benchSlots'));if(Array.isArray(s))init=s}catch(e){}
    const a=(init||DEFAULT_BENCH_SLOTS.map(x=>({...x}))).slice(0,3);
    while(a.length<3)a.push(null);
    db.config.benchSlots=a;
  }
  return db.config.benchSlots;
}

// Calcula el veredicto contra un activo. Devuelve {empty} si no hay aportaciones, null si falla el histórico.
async function computeBench(choice){
  const evts=investEvents();
  if(!evts.length)return{empty:true};
  const prices=choice.kind==='stock'?await fetchStockHistory(choice.symbol):await fetchCoinHistory(choice.cgId);
  if(!prices||!prices.length)return null;
  const priceAt=t=>{if(t<=prices[0].t)return prices[0].v;for(let i=prices.length-1;i>=0;i--)if(prices[i].t<=t)return prices[i].v;return prices[prices.length-1].v};
  let units=0,invested=0,clamped=false;
  evts.forEach(e=>{const t=dateMs(e.date);if(t<prices[0].t)clamped=true;const pr=priceAt(t);if(pr>0)units+=e.usd/pr;invested+=e.usd});
  const benchVal=units*prices[prices.length-1].v;
  const pt=portfolioTotals();
  return{benchVal,myVal:pt.value,myRet:invested>0?(pt.value-invested)/invested*100:0,bRet:invested>0?(benchVal-invested)/invested*100:0,diff:pt.value-benchVal,clamped,oldest:prices[0].t};
}

// Paso "bonito" para los ticks del eje de dinero (1/2/5 × potencia de 10)
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
const fmtAxis=v=>{if(privacy)return'•••';if(v>=1e6)return'$'+(v/1e6).toFixed(1).replace('.0','')+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(1).replace('.0','')+'k';return'$'+Math.round(v)};
function drawEvoChart(value,range,id){
  const c=document.getElementById(id||'evoChart');if(!c)return;
  const dpr=window.devicePixelRatio||1,cssW=c.clientWidth||600,cssH=c.clientHeight||280;
  c.width=cssW*dpr;c.height=cssH*dpr;
  const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cssW,cssH);
  const cut=evoCutoff(range);
  let fval=value.filter(p=>p.t>=cut);
  // Ancla el valor previo al borde izquierdo para que la línea no aparezca cortada al recortar el rango
  if(cut>0){const prevV=value.filter(p=>p.t<cut).pop();if(prevV)fval=[{t:cut,v:prevV.v},...fval]}
  if(!fval.length){ctx.fillStyle='#6b6f85';ctx.font='13px sans-serif';ctx.fillText('Sin datos en este rango todavía',16,40);return}
  let tMin=Math.min(...fval.map(p=>p.t)),tMax=Math.max(...fval.map(p=>p.t));
  if(tMin===tMax){tMin-=864e5;tMax+=864e5}
  const padT=12,padB=24,padL=8,padR=privacy?34:54,W=cssW,H=cssH;
  let vTop=Math.max(...fval.map(p=>p.v),0)*1.08||1;
  const step=niceStep(vTop/4);
  vTop=Math.ceil(vTop/step)*step;
  const X=t=>padL+((t-tMin)/(tMax-tMin))*(W-padL-padR);
  const Y=v=>H-padB-(v/vTop)*(H-padT-padB);
  // Rejilla horizontal + etiquetas de dinero (a la derecha)
  ctx.font='11px -apple-system,sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  for(let v=0;v<=vTop+step/2;v+=step){
    const y=Y(v);
    ctx.strokeStyle=v===0?'#ffffff18':'#ffffff0c';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle='#6b6f85';ctx.fillText(fmtAxis(v),W-padR+6,y);
  }
  // Etiquetas de fechas (abajo)
  const span=(tMax-tMin)/864e5;
  const nT=cssW<480?3:5;
  ctx.textBaseline='alphabetic';
  for(let i=0;i<nT;i++){
    const t=tMin+(tMax-tMin)*i/(nT-1),d=new Date(t);
    let lbl;
    if(span>=300)lbl=d.toLocaleDateString('es',{month:'short'})+" '"+String(d.getFullYear()).slice(2);
    else lbl=d.toLocaleDateString('es',{day:'numeric',month:'short'});
    ctx.textAlign=i===0?'left':i===nT-1?'right':'center';
    ctx.fillStyle='#6b6f85';ctx.fillText(lbl,X(t),H-6);
  }
  // VALOR (línea + área)
  if(fval.length===1){
    ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(X(fval[0].t),Y(fval[0].v),3.5,0,7);ctx.fill();
  }else{
    ctx.beginPath();ctx.lineWidth=2.6;ctx.strokeStyle='#22c55e';
    fval.forEach((p,i)=>{const x=X(p.t),y=Y(p.v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.stroke();
    ctx.lineTo(X(fval[fval.length-1].t),H-padB);ctx.lineTo(X(fval[0].t),H-padB);ctx.closePath();
    const g=ctx.createLinearGradient(0,padT,0,H);g.addColorStop(0,'#22c55e38');g.addColorStop(1,'#22c55e03');ctx.fillStyle=g;ctx.fill();
  }
}

function onPTypeChange(aid){
  const sell=$('#pType').value==='sell';
  $('#pPriceWrap').style.display=sell?'none':'';
  $('#pSaveBtn').textContent=sell?'Registrar venta':'Añadir compra';
  previewPM(aid);
}
function previewPM(aid){
  const a=db.assets.find(x=>x.id===aid);if(!a)return;
  const sell=$('#pType')&&$('#pType').value==='sell';
  const q=+$('#pQty').value;
  if(sell){
    if(q>0){
      const rem=a.qty-q;
      $('#pmPreview').style.display='';$('#pmPreviewLbl').textContent='Te quedarán';
      $('#pmPreviewVal').textContent=`${fmtQty(rem)} ${esc(a.symbol)}`+(rem<0?' ⚠ saldo negativo':'');
    }else{$('#pmPreview').style.display='none'}
    return;
  }
  const p=+$('#pPrice').value;
  if(q>0&&p>0){
    const tq=a.qty+q;
    const tv=a.qty*a.buyPrice+q*p;
    $('#pmPreview').style.display='';$('#pmPreviewLbl').textContent='Nuevo precio medio';
    $('#pmPreviewVal').textContent=fmtPrice(tv/tq);
  }else{$('#pmPreview').style.display='none'}
}
function savePurchase(aid){
  const a=db.assets.find(x=>x.id===aid);if(!a)return;
  const sell=$('#pType')&&$('#pType').value==='sell';
  const q=+$('#pQty').value||0;
  const date=$('#pDate').value||today();
  if(q<=0){alert('Introduce una cantidad mayor que 0');return}
  if(sell){
    // Venta: resta al PRECIO MEDIO vigente para no alterar el PM del restante
    a.purchases.push({id:uid(),qty:-q,price:a.buyPrice,date});
  }else{
    a.purchases.push({id:uid(),qty:q,price:+$('#pPrice').value||0,date});
  }
  recalcAsset(a);saveDB(db);closeModal();render();
}
function deletePurchase(aid,pid){
  const a=db.assets.find(x=>x.id===aid);if(!a)return;
  a.purchases=a.purchases.filter(p=>p.id!==pid);
  recalcAsset(a);saveDB(db);openPurchaseModal(aid);
}

function openSwapModal(assetId){
  const from=db.assets.find(x=>x.id===assetId);if(!from)return;
  // Activos destino: misma wallet, distinto símbolo
  const dests=db.assets.filter(a=>a.wallet===from.wallet&&a.id!==from.id);
  let opts=dests.map(a=>`<option value="${a.id}">${esc(a.symbol)} — ${fmtQty(a.qty)}</option>`).join('');
  opts+=`<option value="__new__">+ Nuevo activo…</option>`;
  let h=`<h2>Swap — vendes ${esc(from.symbol)}</h2>`;
  h+=`<div class="preview-box"><div class="pv-label">Disponible</div><div class="pv-val">${fmtQty(from.qty)} ${esc(from.symbol)} · PM ${fmtPrice(from.buyPrice)}</div></div>`;
  h+=`<div class="form-group"><label>Cantidad de ${esc(from.symbol)} que gastas</label><input id="swFromQty" type="number" step="any" oninput="swPreview('${from.id}')"></div>`;
  h+=`<div class="divider"></div>`;
  h+=`<div class="form-group"><label>Recibes en</label><select id="swDest" onchange="swDestChange()">${opts}</select></div>`;
  h+=`<div id="swNewWrap" style="display:none"><div class="form-row"><div class="form-group"><label>Símbolo nuevo</label><input id="swNewSym"></div><div class="form-group"><label>Precio actual (USD)</label><input id="swNewPrice" type="number" step="any"></div></div></div>`;
  h+=`<div class="form-group"><label>Cantidad que recibes</label><input id="swToQty" type="number" step="any" oninput="swPreview('${from.id}')"></div>`;
  h+=`<div class="form-group"><label>Fecha</label><input id="swDate" type="date" value="${today()}"></div>`;
  h+=`<div class="preview-box" id="swPrev" style="display:none"><div class="pv-label">Resumen</div><div class="pv-val" id="swPrevVal" style="font-size:.9rem;line-height:1.5"></div></div>`;
  h+=`<div class="hint" style="margin:8px 0 12px">El coste del activo recibido = valor en USD de lo que gastas (qty × PM origen) ÷ cantidad recibida.</div>`;
  h+=`<button class="btn btn-primary" onclick="confirmSwap('${from.id}')" style="width:100%">Confirmar swap</button>`;
  openModal(h);
}
function swDestChange(){
  $('#swNewWrap').style.display=$('#swDest').value==='__new__'?'':'none';
}
function swCostUsd(from,fromQty){
  // Valor de coste de lo que sale, al PM de origen (mantiene PM del restante)
  return fromQty*from.buyPrice;
}
function swPreview(fromId){
  const from=db.assets.find(x=>x.id===fromId);if(!from)return;
  const fq=+$('#swFromQty').value||0,tq=+$('#swToQty').value||0;
  if(fq<=0||tq<=0){$('#swPrev').style.display='none';return}
  const costUsd=swCostUsd(from,fq);
  const newPM=costUsd/tq;
  const rem=from.qty-fq;
  $('#swPrev').style.display='';
  $('#swPrevVal').innerHTML=`Sales: ${fmtQty(fq)} ${esc(from.symbol)} (valor ${fmt(costUsd)})<br>Quedan: ${fmtQty(rem)} ${esc(from.symbol)}${rem<0?' ⚠':''}<br>Coste del recibido: ${fmtPrice(newPM)} / ud`;
}
function confirmSwap(fromId){
  const from=db.assets.find(x=>x.id===fromId);if(!from)return;
  const fq=+$('#swFromQty').value||0,tq=+$('#swToQty').value||0;
  const date=$('#swDate').value||today();
  if(fq<=0||tq<=0){alert('Cantidades deben ser mayores que 0');return}
  const destSel=$('#swDest').value;
  const costUsd=swCostUsd(from,fq);   // valor en USD que sale
  const newPM=costUsd/tq;             // coste unitario del activo recibido
  // 1) Restar del origen al PM vigente (no altera PM del restante)
  from.purchases.push({id:uid(),qty:-fq,price:from.buyPrice,date});
  recalcAsset(from);
  // 2) Sumar al destino
  let dest;
  if(destSel==='__new__'){
    const sym=($('#swNewSym').value||'').toUpperCase();
    const curPrice=+$('#swNewPrice').value||newPM;
    if(!sym){alert('Indica el símbolo del nuevo activo');return}
    dest=db.assets.find(a=>a.wallet===from.wallet&&a.symbol===sym);
    if(!dest){dest={id:uid(),wallet:from.wallet,symbol:sym,name:sym,price:curPrice,purchases:[],qty:0,buyPrice:0};db.assets.push(dest)}
  }else{
    dest=db.assets.find(a=>a.id===destSel);
    if(!dest){alert('Activo destino no encontrado');return}
  }
  dest.purchases.push({id:uid(),qty:tq,price:newPM,date});
  recalcAsset(dest);
  saveDB(db);closeModal();render();
}

  openModal(`<h2>Cerrar posición — ${esc(p.taSymbol)}/${esc(p.tbSymbol)}</h2>

    <div class="form-row3"><div class="form-group"><label>${esc(p.tbSymbol)} salida qty</label><input id="cpExTbQ" type="number" step="any" value="${p.curTbQty||''}"></div><div class="form-group"><label>${esc(p.tbSymbol)} precio salida</label><input id="cpExTbP" type="number" step="any" value="${tbPrice||''}"></div><div class="form-group"><label>Fees extra cierre (USD)</label><input id="cpExFees" type="number" step="any" value="0"></div></div>

    <button class="btn btn-warning" onclick="confirmClose('${p.id}')" style="width:100%">Confirmar cierre</button>`);
}
function confirmClose(pid){
  const p=db.positions.find(x=>x.id===pid);if(!p)return;
  p.status='closed';
  p.exitTaQty=+$('#cpExTaQ').value||0;p.exitTaPrice=+$('#cpExTaP').value||poolTokenPrice(p,'a');
  p.exitTbQty=+$('#cpExTbQ').value||0;p.exitTbPrice=+$('#cpExTbP').value||poolTokenPrice(p,'b');
  p.exitFees=+$('#cpExFees').value||0;p.dateOut=$('#cpDateOut').value||today();
  p.curTaQty=p.exitTaQty;p.curTbQty=p.exitTbQty;p.curVal=poolExitVal(p);
  // Return tokens to HODL
  [['taSymbol','exitTaQty','exitTaPrice'],['tbSymbol','exitTbQty','exitTbPrice']].forEach(([sKey,qKey,pKey])=>{
    const sym=p[sKey];const qty=p[qKey];const price=p[pKey];
    if(!sym||!qty)return;
    let existing=db.assets.find(a=>a.wallet===p.wallet&&a.symbol===sym);
    if(existing){existing.purchases.push({id:uid(),qty,price,date:p.dateOut});recalcAsset(existing);existing.price=price}
    else{const a={id:uid(),wallet:p.wallet,symbol:sym,name:sym,price,purchases:[{id:uid(),qty,price,date:p.dateOut}],qty:0,buyPrice:0};recalcAsset(a);db.assets.push(a)}
  });
  saveDB(db);closeModal();go('detail',{detailId:p.id});
}
