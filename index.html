// ===================== IMPORTAR COINMARKETCAP =====================
// Lee el CSV de transacciones de CMC y reconstruye los activos con su historial.
// Decisiones del usuario: historial completo + transferIn a coste 0.
function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else inQ=false}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field=''}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.length>1||row[0]!=='')rows.push(row);row=[];field=''}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows;
}
function cmcNum(s){if(s==null)return NaN;s=String(s).trim();if(s===''||s==='--')return NaN;return parseFloat(s.replace(/,/g,''))}
function cmcMedian(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function parseCmcTransactions(text){
  const rows=parseCSV(text);
  let hi=-1;
  for(let i=0;i<rows.length;i++){const low=rows[i].map(x=>(x||'').trim().toLowerCase());if(low.includes('token')&&low.includes('type')){hi=i;break}}
  if(hi<0)return {txs:[],repriced:[]};
  const head=rows[hi].map(x=>(x||'').trim().toLowerCase());
  const idx={date:head.findIndex(h=>h.startsWith('date')),token:head.indexOf('token'),type:head.indexOf('type'),price:head.findIndex(h=>h.startsWith('price')),amount:head.indexOf('amount'),total:head.findIndex(h=>h.startsWith('total'))};
  const raw=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const token=(r[idx.token]||'').trim().toUpperCase();
    const type=(r[idx.type]||'').trim().toLowerCase();
    if(!token||!type)continue;
    const date=(r[idx.date]||'').trim().slice(0,10);
    const amount=cmcNum(r[idx.amount]);
    const price=cmcNum(r[idx.price]);
    const total=idx.total>=0?cmcNum(r[idx.total]):NaN;
    if(!(amount>0))continue;
    raw.push({token,type,date,amount,price:isNaN(price)?0:price,total:isNaN(total)?0:total});
  }
  // Mediana de precio por token (solo compras/ventas con precio) para detectar filas corruptas
  const byTok={};
  raw.forEach(t=>{if((t.type==='buy'||t.type==='sell')&&t.price>0)(byTok[t.token]=byTok[t.token]||[]).push(t.price)});
  const med={};Object.keys(byTok).forEach(k=>med[k]=cmcMedian(byTok[k]));
  const txs=[],repriced=[];
  raw.forEach(t=>{
    const m=med[t.token];
    // Solo las COMPRAS con precio disparatado se re-precian a la mediana (se conserva la cantidad,
    // que CMC sí cuenta en el saldo). Las ventas usan el coste medio vigente, así que el precio
    // del CSV es irrelevante para ellas.
    if(t.type==='buy'&&m>0&&(t.price>m*50||t.price<m/50||t.total>1e6)){
      repriced.push({token:t.token,date:t.date,bad:t.price,fixed:m});
      t.price=m;
    }
    txs.push(t);
  });
  return {txs,repriced};
}
function cmcReconstruct(txs,transferMode){
  const sorted=[...txs].sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  const acc={};let nBuy=0,nSell=0,nTransfer=0;
  sorted.forEach(t=>{
    if(!acc[t.token])acc[t.token]={symbol:t.token,qty:0,cost:0,entries:[]};
    const a=acc[t.token];
    if(t.type==='buy'){a.qty+=t.amount;a.cost+=t.amount*t.price;a.entries.push({id:uid(),qty:t.amount,price:t.price,date:t.date||today()});nBuy++}
    else if(t.type==='transferin'){
      if(transferMode==='ignore')return;
      a.qty+=t.amount;a.entries.push({id:uid(),qty:t.amount,price:0,date:t.date||today()});nTransfer++;
    }
    else if(t.type==='sell'||t.type==='transferout'){
      const avg=a.qty>0?a.cost/a.qty:0; // venta al coste medio vigente (no altera el PM del resto)
      a.cost-=t.amount*avg;if(a.cost<0)a.cost=0;a.qty-=t.amount;
      a.entries.push({id:uid(),qty:-t.amount,price:avg,date:t.date||today()});nSell++;
    }
  });
  Object.values(acc).forEach(a=>{a.finalQty=a.qty;a.avgCost=a.qty>0?a.cost/a.qty:0});
  return {assets:acc,stats:{nBuy,nSell,nTransfer}};
}
function openCmcImport(){
  openModal(`<h2>Importar de CoinMarketCap</h2>
    <div class="hint" style="margin-bottom:14px">Sube el archivo <strong>..._transactions.csv</strong> de CoinMarketCap. Reconstruyo tus activos con su historial (compras, ventas y fechas) y fusiono en la wallet que elijas.</div>
    <div class="form-group"><label>Wallet destino</label><select id="cmcWallet"><option value="wallet1">${esc(WALLETS.wallet1.name)}</option><option value="wallet2">${esc(WALLETS.wallet2.name)}</option></select></div>
    <div class="form-group"><label>Archivo de transacciones (.csv)</label><input type="file" id="cmcFile" accept=".csv"></div>
    <div class="form-group"><label>Transferencias / airdrops (transferIn)</label><select id="cmcTransfer"><option value="zero">Coste 0 (recomendado)</option><option value="ignore">Ignorarlas</option></select></div>
    <button class="btn btn-primary" onclick="cmcAnalyze()" style="width:100%;margin-top:8px">Analizar archivo</button>`);
}
function cmcAnalyze(){
  const fileEl=$('#cmcFile');
  if(!fileEl||!fileEl.files||!fileEl.files[0]){alert('Elige el archivo CSV de transacciones de CoinMarketCap');return}
  const wallet=$('#cmcWallet').value,transferMode=$('#cmcTransfer').value;
  const reader=new FileReader();
  reader.onload=ev=>{
    const parsed=parseCmcTransactions(ev.target.result);
    if(!parsed.txs.length){alert('No encontré transacciones válidas. Asegúrate de subir el archivo _transactions.csv de CoinMarketCap.');return}
    const rec=cmcReconstruct(parsed.txs,transferMode);
    window.__cmcStaging={wallet,assets:rec.assets,stats:rec.stats,repriced:parsed.repriced};
    renderCmcPreview();
  };
  reader.readAsText(fileEl.files[0]);
}
function renderCmcPreview(){
  const s=window.__cmcStaging;if(!s)return;
  const items=Object.values(s.assets).filter(a=>a.finalQty>1e-9).sort((a,b)=>(b.finalQty*b.avgCost)-(a.finalQty*a.avgCost));
  const zero=Object.values(s.assets).filter(a=>!(a.finalQty>1e-9)).length;
  let h=`<h2>Revisar importación</h2>`;
  h+=`<div class="preview-box"><div class="pv-label">Resumen</div><div class="pv-val" style="font-size:.9rem;line-height:1.7">`;
  h+=`<strong>${items.length}</strong> activos → ${esc(WALLETS[s.wallet].name)}<br>`;
  h+=`Compras: ${s.stats.nBuy} · Ventas: ${s.stats.nSell} · Transferencias coste 0: ${s.stats.nTransfer}<br>`;
  if(s.repriced.length)h+=`<span class="pnl-neg">⚠️ ${s.repriced.length} precio(s) corrupto(s) corregido(s) a la mediana</span><br>`;
  if(zero)h+=`<span style="color:var(--tx3)">${zero} moneda(s) con saldo 0 (vendidas) no se añaden</span>`;
  h+=`</div></div>`;
  h+=`<div class="tbl-wrap" style="max-height:260px;overflow-y:auto"><table><thead><tr><th>Token</th><th>Cantidad</th><th>Precio medio</th></tr></thead><tbody>`;
  items.forEach(a=>{h+=`<tr><td class="asset-sym">${esc(a.symbol)}</td><td>${fmtQty(a.finalQty)}</td><td>${fmtPrice(a.avgCost)}</td></tr>`});
  h+=`</tbody></table></div>`;
  if(s.repriced.length)h+=`<div class="hint" style="margin-top:10px">Precios corregidos: ${s.repriced.slice(0,8).map(x=>x.token+' ('+x.date+')').join(', ')}${s.repriced.length>8?'…':''}</div>`;
  h+=`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-primary" onclick="cmcConfirm()" style="flex:1">Confirmar importación</button><button class="btn btn-secondary" onclick="openCmcImport()" style="flex:1">Volver</button></div>`;
  $('#modalContent').innerHTML=h;
}
function cmcConfirm(){
  const s=window.__cmcStaging;if(!s)return;
  let added=0,merged=0;
  Object.values(s.assets).forEach(t=>{
    if(!(t.finalQty>1e-9))return;
    let ex=db.assets.find(a=>a.wallet===s.wallet&&a.symbol===t.symbol);
    if(ex){t.entries.forEach(e=>ex.purchases.push(e));recalcAsset(ex);merged++}
    else{const a={id:uid(),wallet:s.wallet,symbol:t.symbol,name:t.symbol,price:0,purchases:t.entries.slice(),qty:0,buyPrice:0};recalcAsset(a);db.assets.push(a);added++}
  });
  window.__cmcStaging=null;
  saveDB(db);closeModal();go('portfolio');syncPrices(true);
  setTimeout(()=>alert('Importación completada: '+added+' nuevos, '+merged+' fusionados.\nPulsa ↻ si algún precio actual sale a 0 (tokens no listados se ponen a mano).'),150);
}

async function init(){
  // Pinta ya con datos locales (rápido, offline)
  refreshWallets();syncPrivBtn();render();
  // Comprueba sesión existente
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){
      await onLoggedIn(data.session.user);
    }else{
      authShow(true);
    }
  }catch(e){
    console.warn('Auth init failed',e);
    authError('No se pudo conectar. Trabajando en local.');
    authShow(true);
  }
}
init();
